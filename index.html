<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Workspace - Interactive React CRUD Suite</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  
  <!-- React Mounting Root -->
  <div id="root"></div>

  <!-- Application Modules & Components -->
  <script src="js/sampleData.js"></script>
  <script src="js/utils/storage.js"></script>
  
  <script type="text/babel" src="js/components/Navbar.js"></script>
  <script type="text/babel" src="js/components/StatsOverview.js"></script>
  <script type="text/babel" src="js/components/KanbanView.js"></script>
  <script type="text/babel" src="js/components/GridView.js"></script>
  <script type="text/babel" src="js/components/TableView.js"></script>
  <script type="text/babel" src="js/components/AnalyticsView.js"></script>
  <script type="text/babel" src="js/components/ItemModal.js"></script>
  <script type="text/babel" src="js/components/DeleteModal.js"></script>
  <script type="text/babel" src="js/components/Toast.js"></script>
  
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
